version: '3.8'

# ==============================================================================
# WildAtlas - Full IEEE Reproducibility Stack
# Services:
#   1. app: WildAtlas Express API Server + React Leaflet Frontend (Port 5000)
#   2. osrm: Self-Hosted OSRM Backend (MLD Algorithm, Car Profile, Port 5001)
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wildatlas-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - OSRM_BASE_URL=http://osrm:5000
      - MAP_STYLE_URL=https://tiles.openfreemap.org/styles/liberty
      - TILE_URL_FALLBACK=https://tile.openstreetmap.org/{z}/{x}/{y}.png
    depends_on:
      - osrm
    networks:
      - wildatlas-net

  osrm:
    image: osrm/osrm-backend:v5.27.1
    container_name: wildatlas-osrm
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      - ./data/osrm:/data
    command: osrm-routed --algorithm mld /data/extract.osrm
    networks:
      - wildatlas-net

networks:
  wildatlas-net:
    driver: bridge
